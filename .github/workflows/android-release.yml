name: Android Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK PATH
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          CMDLINE_TOOLS_DIR=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "Using cmdline-tools at: $CMDLINE_TOOLS_DIR"
          echo "$CMDLINE_TOOLS_DIR/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Verify build environment
        shell: bash
        run: |
          node --version
          npm --version
          java --version
          javac --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore signing keystore
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/mockbysu-release.jks
          test -s android/app/mockbysu-release.jks

      - name: Create signing properties
        shell: bash
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=app/mockbysu-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Verify APK
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/MockBySu.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MockBySu v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/release/MockBySu.apk
          generate_release_notes: true
